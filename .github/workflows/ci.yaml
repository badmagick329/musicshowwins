name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DEBUG: "0"
      DJANGO_SETTINGS_MODULE: musicshowwins.test_settings
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Django system check
        run: uv run python manage.py check

      - name: Migration drift check
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Test suite
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build

  production-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Linux AMD64 production image
        run: docker build --platform linux/amd64 --tag kpopwins:ci .

      - name: Check Python runtime
        run: docker run --rm kpopwins:ci python --version

      - name: Check Node.js runtime
        run: docker run --rm kpopwins:ci node --version

      - name: Run Django deployment checks
        run: >-
          docker run --rm
          --env DEBUG=0
          --env SECRET_KEY=test-only-ci-production-secret-with-sufficient-entropy
          --env ALLOWED_HOSTS=api.example.test
          --env CSRF_TRUSTED_ORIGINS=https://api.example.test
          --env DB_ENGINE=django.db.backends.sqlite3
          --env DB_NAME=/tmp/ci-check.sqlite3
          kpopwins:ci python manage.py check --deploy
