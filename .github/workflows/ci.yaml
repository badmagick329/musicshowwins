name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DEBUG: "0"
      DJANGO_SETTINGS_MODULE: musicshowwins.test_settings
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.3"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Django system check
        run: uv run python manage.py check

      - name: Migration drift check
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Test suite
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build

  operator-tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator-tools
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: operator-tools/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Test suite
        run: uv run pytest

  production-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build Linux AMD64 production image
        run: docker build --platform linux/amd64 --tag kpopwins:ci .

      - name: Check Python runtime
        run: docker run --rm kpopwins:ci python --version

      - name: Check Node.js runtime
        run: docker run --rm kpopwins:ci node --version

      - name: Reject Django startup without a production secret
        run: python scripts/check-production-image.py kpopwins:ci

      - name: Verify standalone public cache and warming boundaries
        run: python scripts/check-frontend-cache.py kpopwins:ci

      - name: Run Django deployment checks
        run: >-
          docker run --rm
          --env SECRET_KEY=test-only-ci-production-secret-with-sufficient-entropy
          --env ALLOWED_HOSTS=api.example.test
          --env CSRF_TRUSTED_ORIGINS=https://api.example.test
          --env DB_ENGINE=django.db.backends.sqlite3
          --env DB_NAME=/tmp/ci-check.sqlite3
          kpopwins:ci python manage.py check --deploy
