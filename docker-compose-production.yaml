x-backend-environment: &backend-environment
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  DEBUG: "0"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS is required}
  DB_ENGINE: ${DB_ENGINE:-django.db.backends.postgresql}
  DB_NAME: ${DB_NAME:?DB_NAME is required}
  DB_USER: ${DB_USER:?DB_USER is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  DISCORD_CORRECTIONS_WEBHOOK_URL: ${DISCORD_CORRECTIONS_WEBHOOK_URL:-}
  WIKI_AGENT: ${WIKI_AGENT:?WIKI_AGENT is required}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: kpopwins:${KPOPWINS_IMAGE_TAG:?KPOPWINS_IMAGE_TAG is required}
    pull_policy: never
    restart: "no"
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["/bin/sh", "-c", "python manage.py migrate --noinput && python manage.py ensure_bootstrap"]

  backend:
    image: kpopwins:${KPOPWINS_IMAGE_TAG:?KPOPWINS_IMAGE_TAG is required}
    pull_policy: never
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["gunicorn", "musicshowwins.wsgi:application", "--bind", "0.0.0.0:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s

  frontend:
    image: kpopwins:${KPOPWINS_IMAGE_TAG:?KPOPWINS_IMAGE_TAG is required}
    pull_policy: never
    restart: unless-stopped
    environment:
      DJANGO_API_BASE_URL: ${DJANGO_API_BASE_URL:-http://backend:8000/api/v1}
      SUPPORT_URL: ${SUPPORT_URL:-}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    command: ["node", "/app/frontend/server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
