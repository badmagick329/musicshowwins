[project]
name = "kpopwins-operator"
version = "0.1.0"
description = "Local operator tools for maintaining KpopWins reference data"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["requests>=2.32,<3", "tzdata>=2025.2"]

[project.scripts]
kpopwins-operator = "kpopwins_operator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
